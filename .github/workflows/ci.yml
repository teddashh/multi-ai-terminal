name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run verify:version
      - run: npm run build
      - run: npm test
      - run: npm run test:agent
        env:
          MAT_AGENT_IT: '1'
      - run: npm run typecheck
      - run: npm run evidence
        if: runner.os == 'Linux'
      - run: npm run smoke:browser
