name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
            bundles: deb,appimage,rpm
          - os: macos-14
            label: macOS arm64
            bundles: dmg,app
          - os: macos-15-intel
            label: macOS x64
            bundles: dmg,app
          - os: windows-latest
            label: Windows x64
            bundles: msi,nsis
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci
      - name: Verify tag and synchronized versions
        env:
          MAT_EXPECT_TAG: ${{ env.RELEASE_TAG }}
        run: npm run verify:version
      - run: npm run build
      - name: Verify release source and bundled-server contracts
        if: runner.os == 'Linux'
        run: |
          npm test
          npm run typecheck
          npm run evidence
          npm run smoke:browser
      - run: node scripts/bundle-desktop.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Multi-AI Terminal ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
