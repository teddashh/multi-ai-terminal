[package]
name = "multi-ai-terminal"
version = "0.2.0"
description = "Desktop shell for Multi-AI Terminal"
edition = "2021"

[[bin]]
name = "multi-ai-terminal"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
dunce = "1"
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
