<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-AI Terminal</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #18181b; color: #e4e4e7; }
      body { display: grid; place-items: center; }
      main { width: min(32rem, calc(100% - 3rem)); text-align: center; }
      .spinner { width: 2rem; height: 2rem; margin: 0 auto 1rem; border: 3px solid #3f3f46; border-top-color: #a78bfa; border-radius: 50%; animation: spin 0.8s linear infinite; }
      p { margin: 0; color: #a1a1aa; font-size: 0.95rem; }
      .error { text-align: left; padding: 1.25rem; border: 1px solid #7f1d1d; border-radius: 0.75rem; background: #271719; }
      .error h1 { margin: 0 0 0.75rem; color: #fca5a5; font-size: 1.1rem; }
      .error pre { margin: 0; color: #e4e4e7; font: 0.85rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.8s; } }
    </style>
    <script>
      window.__matShowError = function (message) {
        const render = function () {
          const main = document.querySelector('main');
          if (!main) return;
          main.className = 'error';
          main.replaceChildren();
          const title = document.createElement('h1');
          title.textContent = 'Multi-AI Terminal could not start';
          const details = document.createElement('pre');
          details.textContent = String(message);
          main.append(title, details);
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render, { once: true });
        else render();
      };
    </script>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <p>Starting Multi-AI Terminal…</p>
    </main>
  </body>
</html>
